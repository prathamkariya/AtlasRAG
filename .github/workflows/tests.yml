name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Light dependencies only: tests use fakes, so no torch / sentence-transformers download.
      - run: pip install numpy pyyaml python-dotenv rank-bm25 pytest openai httpx tqdm pymupdf requests arxiv fastapi pydantic ruff
      - run: python -m compileall -q src scripts tests
      - run: ruff check --select F src scripts tests
      - run: PYTHONPATH=src python -m pytest -q
      - name: frozen corpus v3 matches its manifest
        run: ATLAS_CONFIG=configs/corpus_v3.yaml PYTHONPATH=src python scripts/make_corpus_manifest.py --verify corpus/manifests/atlasrag-corpus-v3.json
      - name: benchmark v3 matches its manifest hash
        run: python scripts/verify_benchmark.py
